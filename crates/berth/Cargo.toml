[package]
name = "berth"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "berth"
path = "src/main.rs"

[dependencies]
berth-core = { workspace = true }
berth-daemon = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
tracing-subscriber = { workspace = true }

# `QueryFullProcessImageNameW` for the version-skew message and
# `TerminateProcess` for the BERTH KILL fallback, when a version-skewed daemon
# cannot be reached over the DAEMON SOCKET.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
