[package]
name = "berth-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_bytes = { workspace = true }
ulid = { workspace = true }
directories = { workspace = true }
rmp-serde = { workspace = true }
# `process`, `signal` and `macros` are for `platform`: the NoWindow knob,
# the termination signal and the select over it.
tokio = { version = "1", features = ["io-util", "net", "process", "time", "signal", "macros"] }

# Windows has no AF_UNIX socket for the DAEMON SOCKET, so `transport` falls
# back to loopback TCP with a bearer token; these two are what mint and
# compare it. Unix keeps the crate dep-light.
[target.'cfg(windows)'.dependencies]
rand = "0.10"
subtle = "2"
# `platform`'s working-set and installed-RAM probes and its process table;
# unix shells out to ps/sysctl or reads /proc instead.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

# `platform`'s /proc reader needs sysconf for clock ticks and page size.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "rt", "macros", "net", "time"] }

# `platform`'s Windows resolver tests build fake install layouts; Unix stays dep-light.
[target.'cfg(windows)'.dev-dependencies]
tempfile = "3"
