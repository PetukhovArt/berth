name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A branch only needs its newest commit checked; supersede the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check

  # Clippy checks and the tests build the workspace in different modes, so one
  # runner does both serially for nothing: they run side by side, each with its
  # own cache.
  clippy:
    name: clippy (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the compiler; rustup 1.28+ does not install it on first use.
      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo clippy --workspace --exclude berth-desktop --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-latest]
    env:
      # No debug info: on Windows the PDBs add a fifth to the cache and about 20 s to the test
      # build, and a failing test still prints its panic location.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Several test repos commit without setting an author, and a fresh
      # runner has no global identity to fall back on.
      - name: Give git an identity
        run: |
          git config --global user.name berth-ci
          git config --global user.email ci@berth.dev

      # e2e_pty is `#![cfg(unix)]`, e2e_windows is `#![cfg(windows)]`
      # — each host runs its own half of the end-to-end grid.
      - run: cargo test --workspace --exclude berth-desktop --locked
