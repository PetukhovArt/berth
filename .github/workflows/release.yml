name: Release

on:
  # A version bump landing on main *is* the release: this workflow builds it,
  # tags it and publishes the GitHub release. The tag is the record
  # of what shipped, not the trigger — a tag pushed with GITHUB_TOKEN starts no
  # workflow, so hanging the release off one would tag and publish nothing.
  # A tag pushed by hand still works: it re-releases that exact commit.
  push:
    branches: [main]
    tags: ["v*"]
  # Dry run: build the whole matrix on demand without publishing anything, so
  # a cross-compile break is caught before a version bump lands.
  workflow_dispatch:

permissions:
  contents: write
  issues: write

# Two version bumps in a row must not race for the same tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # What is this run — a release, a dry run, or nothing at all?
  gate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.decide.outputs.version }}
      build: ${{ steps.decide.outputs.build }}
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: decide
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 |
            sed -n 's/.*"name":"berth","version":"\([^"]*\)".*/\1/p')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$GITHUB_REF" in
            refs/tags/v*)
              # A tag that disagrees with the workspace version ships a binary
              # whose `--version` lies. Cheaper to fail here than to yank a
              # release.
              tag="${GITHUB_REF_NAME#v}"
              [ "$version" = "$tag" ] ||
                { echo "tag $GITHUB_REF_NAME != workspace version $version"; exit 1; }
              build=true; release=true ;;
            refs/heads/main)
              # Most pushes to main are not releases. A version nobody has
              # tagged yet is.
              if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
                echo "v$version is already released - nothing to do"
                build=false; release=false
              else
                echo "v$version is new - releasing"
                build=true; release=true
              fi ;;
            *)
              build=true; release=false ;;
          esac
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The archive `install.sh` downloads.
      - name: Package (unix)
        if: matrix.runner != 'windows-latest'
        run: tar -czf berth-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release berth

      - name: Package (windows)
        if: matrix.runner == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/berth.exe -DestinationPath berth-${{ matrix.target }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: berth-${{ matrix.target }}.*

  # The desktop app for every platform, with `berth` bundled beside it (the
  # app starts the daemon from that copy), as the installer a person runs and
  # the signed package the app's updater installs. `latest.json`, written in
  # the release job, points each platform at its package.
  desktop:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    name: desktop (${{ matrix.asset }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: x86_64-windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - asset: aarch64-macos
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - asset: x86_64-macos
            runner: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - asset: x86_64-linux
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      # whisper.cpp tunes itself to the CPU it is built on by default; an installer built on
      # the runner's CPU would crash with an illegal instruction on an older one.
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4

      - run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: System libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - name: Add rust target
        run: rustup target add ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      # `bundle.externalBin` in tauri.release.conf.json packs this file as
      # `berth` beside the app executable.
      - name: Bundled CLI
        run: |
          cargo build --release --locked -p berth --target ${{ matrix.target }}
          ext=""
          if [ "$RUNNER_OS" = Windows ]; then ext=.exe; fi
          mkdir -p apps/desktop/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/berth$ext" "apps/desktop/src-tauri/binaries/berth-${{ matrix.target }}$ext"

      # The app compares this version with the one latest.json names.
      - name: App version
        run: printf '{"version":"%s"}\n' "$VERSION" > apps/desktop/src-tauri/tauri.version.conf.json

      - run: pnpm build:tokens

      # The `voice` feature (the local speech engine, Windows and macOS) compiles
      # whisper.cpp with CMake and its bindings with bindgen, which needs libclang.
      # The runner images carry both; this step only makes sure of it and tells
      # bindgen where LLVM is, as `Get-VoiceSetup` in scripts/install-app.ps1 does.
      - name: Speech engine tools
        if: runner.os != 'Linux'
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            if [ ! -f "/c/Program Files/LLVM/bin/libclang.dll" ]; then choco install llvm -y --no-progress; fi
            if ! command -v cmake >/dev/null; then
              choco install cmake -y --no-progress --installargs 'ADD_CMAKE_TO_PATH=System'
              echo 'C:\Program Files\CMake\bin' >> "$GITHUB_PATH"
            fi
            # bindgen asks clang.exe for its include folders: libclang.dll alone does not find them.
            echo 'LIBCLANG_PATH=C:\Program Files\LLVM\bin' >> "$GITHUB_ENV"
            echo 'CLANG_PATH=C:\Program Files\LLVM\bin\clang.exe' >> "$GITHUB_ENV"
          else
            # libclang comes with the Xcode Command Line Tools.
            command -v cmake >/dev/null || brew install cmake
            xcode-select -p
          fi

      # The Windows build links sherpa-onnx as DLLs, which the installer has to
      # carry beside `berth-desktop.exe`: the wake word needs them. The build puts
      # them next to the executable, but tauri-build wants every resource to exist
      # before it compiles, so a first cargo build produces them and the release
      # config below lists them. (macOS links sherpa-onnx statically.)
      - name: Speech engine libraries
        if: runner.os == 'Windows'
        run: |
          pnpm --filter @berth/web build
          cargo build --release --locked -p berth-desktop --lib --features updater,voice --target ${{ matrix.target }}
          for dll in sherpa-onnx-c-api onnxruntime; do
            cp "target/${{ matrix.target }}/release/$dll.dll" apps/desktop/src-tauri/binaries/
          done

      - name: Build
        working-directory: apps/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          features=updater
          extra=()
          case "$RUNNER_OS" in
            Windows) features=updater,voice; extra=(--config src-tauri/tauri.release.voice-windows.conf.json) ;;
            macOS) features=updater,voice ;;
          esac
          pnpm exec tauri build \
            --target ${{ matrix.target }} \
            --bundles ${{ matrix.bundles }} \
            --features "$features" \
            --config src-tauri/tauri.release.conf.json \
            --config src-tauri/tauri.version.conf.json \
            "${extra[@]}"

      - name: Name the files
        run: |
          bundle="target/${{ matrix.target }}/release/bundle"
          name="berth-desktop-${{ matrix.asset }}"
          one() { test "$(ls $1 | wc -l)" -eq 1 && ls $1; }
          mkdir out
          case "$RUNNER_OS" in
            Windows) package=$(one "$bundle/nsis/*-setup.exe"); file="$name-setup.exe" ;;
            macOS)
              cp "$(one "$bundle/dmg/*.dmg")" "out/$name.dmg"
              package=$(one "$bundle/macos/*.app.tar.gz"); file="$name.app.tar.gz" ;;
            Linux) package=$(one "$bundle/deb/*.deb"); file="$name.deb" ;;
          esac
          cp "$package" "out/$file"
          cp "$package.sig" "out/$file.sig"

      - uses: actions/upload-artifact@v4
        with:
          name: archive-desktop-${{ matrix.asset }}
          path: out/*

  release:
    needs: [gate, build, desktop]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true

      # Before tagging: a release whose section is missing would ship with no notes.
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 { f = 1; next }
            f && index($0, "## ") == 1 { exit }
            f
          ' CHANGELOG.md > RELEASE_NOTES.md
          grep -q '[^[:space:]]' RELEASE_NOTES.md ||
            { echo "::error::CHANGELOG.md has no '## $VERSION (YYYY-MM-DD)' section"; exit 1; }

      # What the desktop app's updater reads from the latest release: one
      # package per platform with the signature of its bytes. A platform
      # missing here would make the updater reject the whole file.
      - name: Update manifest
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION"
          entry() {
            jq -n --arg key "$1" --arg url "$base/$2" --rawfile sig "$2.sig" \
              '{($key): {url: $url, signature: ($sig | gsub("\\s"; ""))}}'
          }
          {
            entry windows-x86_64 berth-desktop-x86_64-windows-setup.exe
            entry darwin-aarch64 berth-desktop-aarch64-macos.app.tar.gz
            entry darwin-x86_64 berth-desktop-x86_64-macos.app.tar.gz
            entry linux-x86_64 berth-desktop-x86_64-linux.deb
          } | jq -s --arg version "$VERSION" --rawfile notes RELEASE_NOTES.md \
            --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{version: $version, notes: ($notes | gsub("^\\s+|\\s+$"; "")), pub_date: $date, platforms: add}' > latest.json
          cat latest.json

      # Only when the run came from main — a tag push already has one.
      - name: Tag this version
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/v${{ needs.gate.outputs.version }}" \
            -f sha="$GITHUB_SHA"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.gate.outputs.version }}
          files: |
            berth-*.tar.gz
            berth-*.zip
            berth-desktop-*.deb
            berth-desktop-*.exe
            berth-desktop-*.dmg
            latest.json
          body_path: RELEASE_NOTES.md

      - name: Note the release on its fixed issues
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          retry() { for wait in 5 15 45; do "$@" && return 0; sleep "$wait"; done; "$@"; }
          retry gh issue list -R "$GITHUB_REPOSITORY" --state closed --label fixed-on-main --limit 200 --json number -q '.[].number' > fixed.txt
          while read -r n; do
            retry gh issue edit "$n" -R "$GITHUB_REPOSITORY" --remove-label fixed-on-main
            retry gh issue comment "$n" -R "$GITHUB_REPOSITORY" --body "Released in berth $VERSION: https://github.com/$GITHUB_REPOSITORY/releases/tag/v$VERSION"
          done < fixed.txt

