[package]
name = "berth-desktop"
version = "0.0.0"
edition.workspace = true
license.workspace = true
default-run = "berth-desktop"

[lib]
name = "berth_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "berth-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "berth-server"
path = "src/bin/berth-server.rs"

[features]
default = ["desktop", "voice"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-opener"]
voice = ["desktop", "dep:whisper-rs", "dep:cpal", "dep:sherpa-onnx", "dep:sha2", "dep:bzip2", "dep:tar"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
berth-core = { workspace = true }
tokio = { version = "1", features = ["net", "io-util", "sync", "macros", "time", "rt", "rt-multi-thread", "process", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
futures-util = "0.3"
url = "2"
tauri-plugin-opener = { version = "2", optional = true }
axum = { version = "0.8", features = ["ws"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
getrandom = "0.3"
web-push-native = "0.5"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", optional = true }
cpal = { version = "0.18", optional = true }
sha2 = { version = "0.10", optional = true }
bzip2 = { version = "0.6", optional = true }
tar = { version = "0.4", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_LibraryLoader"] }
sherpa-onnx = { version = "2.0.1", default-features = false, features = ["shared"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
sherpa-onnx = { version = "2.0.1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
